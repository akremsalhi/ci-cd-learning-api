name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# The pipeline only reads the repository. No deployment credentials here.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
